<script>
const NS='http://www.w3.org/2000/svg',mk=(n,a,p)=>{const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
let r=11;const rnd=()=>(r=(r*9301+49297)%233280)/233280;
const st=document.getElementById('stars');
for(let i=0;i<34;i++){const x=rnd()*1080,y=290+rnd()*420,s=6+rnd()*9;mk('path',{d:`M${x} ${y-s}L${x+s*.3} ${y-s*.3}L${x+s} ${y}L${x+s*.3} ${y+s*.3}L${x} ${y+s}L${x-s*.3} ${y+s*.3}L${x-s} ${y}L${x-s*.3} ${y-s*.3}Z`,fill:'#ffe680'},st);}
const sn=document.getElementById('snow');
for(let i=0;i<60;i++)mk('circle',{cx:rnd()*1080,cy:230+rnd()*880,r:3+rnd()*6,opacity:.9},sn);
const balls=document.getElementById('balls');
[[500,470,'#d6342c'],[585,500,'#ffd23a'],[470,610,'#ffd23a'],[560,590,'#d6342c'],[640,640,'#7ec8f5'],[430,720,'#d6342c'],[540,700,'#7ec8f5'],[660,740,'#ffd23a'],[600,430,'#7ec8f5']].forEach(([x,y,c])=>mk('circle',{cx:x,cy:y,r:14,fill:c,'stroke-width':4},balls));
const cols=['#ffd23a','#ff8aa6','#76d27a','#7ec8f5','#ff8a3d','#fff6dc'];
const put=(id,t,off)=>{const el=document.getElementById(id);[...t].forEach((ch,i)=>{const s=document.createElement('span');s.className='c';s.textContent=ch===' '?' ':ch;s.style.color=cols[(i+off)%cols.length];s.style.transform=`rotate(${(i%3-1)*4}deg) translateY(${(i%2)*5}px)`;el.appendChild(s)})};
put('l1','IV Torneig',0);put('l2','de Nadal',2);
window.render=()=>{};
document.fonts.ready.then(()=>Promise.all([...document.images].map(im=>im.complete?1:new Promise(x=>im.onload=x)))).then(()=>{window.READY=true});
</script></body></html>
