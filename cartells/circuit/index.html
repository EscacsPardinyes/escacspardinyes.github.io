*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden;background:#0a0a0a}
body{position:relative;font-family:'Century Gothic','Futura','Segoe UI',Arial,sans-serif;color:#f5ecd2}
.bg{position:absolute;inset:0;background:radial-gradient(ellipse 700px 500px at 540px 160px,#3a3220 0%,#17140c 50%,#0a0a0a 100%)}
.gold{background:linear-gradient(100deg,#8a6420 0%,#e9c46a 22%,#fff3c4 40%,#e9c46a 58%,#9c7220 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.frame{position:absolute;inset:24px;border:2px solid #d8b25a}

img.club{position:absolute;top:54px;left:54px;width:96px;height:96px;object-fit:contain;background:#fff;border:3px solid #d8b25a}
.head{position:absolute;top:58px;left:0;right:0;text-align:center}
.kicker{font-size:20px;letter-spacing:.4em;text-transform:uppercase;color:#e9c46a}

.sub{font-size:24px;letter-spacing:.3em;text-transform:uppercase;margin-top:12px}
.grid{position:absolute;top:282px;left:120px;right:120px;display:grid;grid-template-columns:repeat(3,1fr);column-gap:24px;row-gap:16px}
.card{text-align:center}
.card img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border:2px solid #d8b25a;box-shadow:0 14px 26px #000c}
.card b{display:block;margin-top:8px;font-size:20px;letter-spacing:.22em;text-transform:uppercase;color:#e9c46a}
.foot{position:absolute;left:60px;right:60px;bottom:52px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #d8b25a99;padding-top:16px}
.foot span{font-size:19px;letter-spacing:.18em;text-transform:uppercase;color:#d9cfae}
.foot .web{font-size:22px;color:#e9c46a;font-weight:700}
.patro{position:absolute;left:60px;right:60px;top:1066px;border:2px solid #d8b25a;background:#ffffff0a;padding:16px 28px;display:flex;align-items:center;gap:30px}
.patro .l{flex:1}
.patro .q{font-family:Georgia,serif;font-weight:700;font-size:38px;line-height:1.1;display:inline-block;white-space:nowrap}
.patro .d{margin-top:6px;font-size:17px;line-height:1.4;color:#d9cfae}
.patro .d b{color:#e9c46a}
.patro .r{text-align:right;border-left:1px solid #d8b25a66;padding-left:28px;white-space:nowrap}
.patro .r small{display:block;font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:#e9c46a}
.patro .r div{margin-top:6px;font-size:20px;line-height:1.35}
